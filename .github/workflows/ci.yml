# Checks the catalog pipeline and the app on every pull request and on main,
# then deploys the app to Cloudflare Pages once main is green.
# The catalog itself is published by hand (pnpm publish-catalog in catalog/):
# its images only exist where the crawl ran.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: catalog/package.json
          cache: true
          cache_dependency_path: catalog/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Also type-checks the app, the domain and the tests.
      - run: pnpm build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [catalog, app]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_BASE_URL: ${{ vars.CATALOG_BASE_URL }}
      APP_PROJECT: ${{ vars.APP_PROJECT || 'nova-preem' }}
    steps:
      - name: Check configuration
        # Runs before the checkout: app/ does not exist yet.
        working-directory: .
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CATALOG_BASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (repository secrets / variables)"; exit 1; fi
          done
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_CATALOG_BASE_URL: ${{ vars.CATALOG_BASE_URL }}
          # Google Drive sync (docs/sync-spec.md §9); empty: the sync stays off ("Bientôt").
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - id: deploy
        # pipefail: without it, the step takes tee's exit status and a failed deploy looks green.
        run: |
          set -o pipefail
          pnpm dlx wrangler@4.155.0 pages deploy dist --project-name="$APP_PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s)" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

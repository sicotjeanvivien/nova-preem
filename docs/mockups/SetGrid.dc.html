<!doctype html>
<html lang="fr">

</style>
</helmet>

</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 12px; color: #A3AAB9">Set 1</span>
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 18px; line-height: 1.2">Welcome to Night City</h1>
</div>
<div style="text-align: right; padding-right: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: {{accent}}">{{ownedCount}} / {{total}}</div>
<div style="font-size: 11px; color: #A3AAB9">variantes possédées</div>
</div>
</header>

<div role="tablist" aria-label="Tirages du set" style="flex-shrink: 0; display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid #232838; background: #11141B">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 12px; border: 0; background: transparent; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; color: {{t.fg}}; border-bottom: 2px solid {{t.line}}">{{t.label}} <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: #A3AAB9">{{t.count}}</span></button>
</sc-for>
</div>
<sc-if value="{{hasSubs}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Tirage précis" style="flex-shrink: 0; display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid #232838; background: #11141B">
<sc-for list="{{subs}}" as="sb" hint-placeholder-count="4">
<button onClick="{{sb.pick}}" aria-pressed="{{sb.pressed}}" style="height: 30px; padding: 0 10px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; border: 1px solid {{sb.border}}; background: {{sb.bg}}; color: {{sb.fg}}">{{sb.label}}</button>
</sc-for>
</div>
</sc-if>
<div style="flex-shrink: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #232838; background: #11141B">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; color: #A3AAB9">Un tap ajoute</span>
<sc-if value="{{showLang}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Langue saisie" style="display: flex; border: 1px solid #2B3040; border-radius: 8px; overflow: hidden">
<sc-for list="{{langBtns}}" as="l" hint-placeholder-count="2">
<button onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="height: 34px; min-width: 52px; padding: 0 10px; border: 0; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{voOnly}}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FB4FF; border: 1px solid #8FB4FF; border-radius: 6px; padding: 6px 8px">VO uniquement</span>
</sc-if>
<button onClick="{{toggleMode}}" aria-pressed="{{removeMode}}" style="margin-left: auto; height: 34px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid {{modeBorder}}; background: {{modeBg}}; color: {{modeFg}}">{{modeLabel}}</button>
</div>
<div role="group" aria-label="Filtrer" style="display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>

</div>
<sc-if value="{{isMissingFilter}}" hint-placeholder-val="{{ false }}">

</div>
<div style="padding: 6px 7px 4px; font-size: 12px; line-height: 1.25; height: 32px; overflow: hidden">{{c.name}}</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px 2px 7px; min-height: 36px">
<div style="display: flex; gap: 4px">

<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; color: #0D0F14; background: {{b.color}}; border-radius: 4px; padding: 1px 4px">{{b.label}}</span>
</sc-for>
</div>
<a href="CardDetail.dc.html" aria-label="{{c.openAria}}" style="width: 36px; height: 36px; color: #A3AAB9; display: grid; place-items: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>
</div>
</sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 32px 0; text-align: center; color: #A3AAB9; font-size: 14px">Aucune carte pour ce filtre.</p>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">

<span style="flex: 1; min-width: 0">{{toastText}}</span>
<button onClick="{{undo}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{accent}}; font-weight: 600; cursor: pointer">Annuler</button>

<nav aria-label="Navigation principale" style="height: 68px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #232838; background: #11141B">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{accent}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="2"></rect><path d="M4 7v11a3 3 0 0 0 3 3h9"></path></svg>Sets</a>
<a href="Collection.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path><path d="M9.5 10l2 2 3.5-3.5"></path></svg>Collection</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Recherche</a>
<a href="Completion.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Réglages</a>
</nav>

</div>
</x-dc>

    let sheet = { n: '', fr: '', en: '', rLabel: '', stripe: '#232838', rows: [] };
    if (s.open) {
      const c = CARDS.find((x) => x.n === s.open); const q = s.qty[c.n];
      sheet = {
        n: c.n, fr: c.fr, en: c.en, rLabel: RARITY[c.r].label, stripe: STRIPE[c.col],
        rows: ['fr', 'en'].map((l) => ({
          code: LANG[l].code, color: LANG[l].color, label: LANG[l].label, qty: q[l],
          decAria: 'Retirer un exemplaire ' + LANG[l].code, incAria: 'Ajouter un exemplaire ' + LANG[l].code,
          dec: () => this.change(c.n, l, -1), inc: () => this.change(c.n, l, 1)
        }))
      };
    }

    return {
      accent, total, ownedCount, cards, langBtns, filters, sheet,
      tabs: [['retail', 'Retail', ownedCount + '/' + total], ['beta', 'Beta', '4/68'], ['starters', 'Starters', '11/34'], ['demo', 'Démos', '0/10'], ['promo', 'Promos', '2/56']].map(([id, label, count]) => ({
        label, count, selected: s.tab === id ? 'true' : 'false', fg: s.tab === id ? '#ECEEF3' : '#A3AAB9', line: s.tab === id ? accent : 'transparent',
        pick: () => this.setState({ tab: id, sub: 0 })
      })),
      subs: ({
        starters: ['Tous', 'The Heist — Retail', 'The Heist — Beta', 'Embracing Power — Retail', 'Embracing Power — Beta'],
        demo: ['Tous', 'Merc', 'Arasaka'],
        promo: ['Toutes', 'Pre-Release Retail', 'Pre-Release Beta', 'Box Toppers Retail', 'Box Toppers Beta', 'Edgerunner Open S1', 'Night City Brawl S1', 'Night City Showdown S1', 'Set 1 Promos', 'Judge Promos']
      }[s.tab] || []).map((label, i) => {
        const on = (s.sub || 0) === i;
        return { label, pressed: on ? 'true' : 'false', bg: on ? '#2B3040' : 'transparent', fg: on ? '#ECEEF3' : '#A3AAB9', border: on ? '#3A4152' : '#232838', pick: () => this.setState({ sub: i }) };
      }),
      hasSubs: ['starters', 'demo', 'promo'].includes(s.tab),
      showLang: s.tab === 'retail', voOnly: s.tab !== 'retail',
      isMissingFilter: s.filter === 'missing', missingCount: total - ownedCount,
      copyMissing: () => this.setState({ last: { n: null, lang: null, delta: 0, text: 'Liste des manques copiée, prête à coller sur Discord.' } }),
      empty: cards.length === 0,
      removeMode: s.remove ? 'true' : 'false',
      modeLabel: s.remove ? 'Mode retrait' : 'Mode ajout',
      modeBg: s.remove ? '#3A1C25' : 'transparent', modeFg: s.remove ? '#FF8FAB' : '#D5D9E2', modeBorder: s.remove ? '#FF5C8A' : '#2B3040',
      toggleMode: () => this.setState({ remove: !s.remove }),
      sheetOpen: !!s.open, closeSheet: () => this.setState({ open: null }),
      hasToast: !!s.last, toastText: s.last ? s.last.text : '',
      undo: () => { const l = s.last; if (!l) return; if (l.n) this.change(l.n, l.lang, -l.delta); this.setState({ last: null }); }
    };
  }
}
</script>

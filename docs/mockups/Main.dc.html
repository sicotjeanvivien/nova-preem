</sc-if>

<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A3AAB9">1 set</span>
</div>
<label for="setq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrer les sets</label>
<input id="setq" type="search" placeholder="Filtrer par nom" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #2B3040; background: #161922; color: #ECEEF3; font-size: 14px; font-family: inherit">

<a href="SetReleases.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #161922; border: 1px solid #232838; border-radius: 12px; color: #ECEEF3">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; background: #1C2029; display: grid; place-items: center; overflow: hidden">
<img src="/_blob/97c94c01913e25d67a57cdc075f6806c" alt="" style="width: 100%; height: 100%; box-sizing: border-box; padding: 4px; object-fit: contain">
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 600">Welcome to Night City</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A3AAB9">{{done}} / {{total}} tirages complétés</span>
<div style="height: 5px; background: #232838; border-radius: 3px; overflow: hidden"><div style="height: 100%; width: {{pct}}%; background: {{accent}}"></div></div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3AAB9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div aria-disabled="true" style="display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px dashed #3A4152; border-radius: 12px">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; border: 1px dashed #3A4152"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600; color: #D5D9E2">Edgerunners: Burn Bright</span>
<span style="font-size: 13px; color: #A3AAB9">Printemps 2027 · affiché dès qu'il sera dans le catalogue</span>
</div>
</div>

<p style="margin: 8px 0; font-size: 12px; color: #8B92A3; text-align: center">Fan-made, non officiel. Données : base officielle des cartes.</p>
</main>

<nav aria-label="Navigation principale" style="height: 68px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #232838; background: #11141B">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{accent}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="2"></rect><path d="M4 7v11a3 3 0 0 0 3 3h9"></path></svg>Sets</a>
<a href="Collection.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path><path d="M9.5 10l2 2 3.5-3.5"></path></svg>Collection</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Recherche</a>
<a href="Completion.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Réglages</a>
</nav>
<sc-if value="{{toastOpen}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 84px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #1F2330; border: 1px solid {{toastBorder}}; box-shadow: 0 8px 24px rgba(0,0,0,0.45); font-size: 13px; color: #ECEEF3; line-height: 1.4">
<span style="color: {{toastColor}}; display: grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.2-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5"></path><circle cx="12" cy="20" r="0.6" fill="currentColor"></circle></svg></span><span style="flex: 1">{{toastText}}</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reseau":{"editor":"enum","default":"en-ligne","options":["en-ligne","pret","hors-ligne"]},"accent":{"editor":"color","default":"#46E3C8","options":["#46E3C8","#FF5C8A","#FFB067","#8FB4FF"]},"$preview":{"width":390,"height":844}}'>

const NET = {
  'en-ligne': null,
  'pret': ['Nova Preem fonctionne maintenant sans réseau.', '#46E3C8', '#2B6B60'],
  'hors-ligne': ['Hors-ligne. Vos saisies sont enregistrées sur l\u2019appareil.', '#FFD99A', '#5A4520']
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: (props.reseau ?? 'en-ligne') !== 'en-ligne' }; }
  componentDidUpdate(prev) { if (prev.reseau !== this.props.reseau) this.setState({ toast: (this.props.reseau ?? 'en-ligne') !== 'en-ligne' }); }
  renderVals() {
    const accent = this.props.accent ?? '#46E3C8';
    const done = 2; const total = 17;
    const net = this.props.reseau ?? 'en-ligne';
    const t = NET[net] || NET['hors-ligne'];
    return {
      accent, done, total, pct: Math.floor((done / total) * 100),
      offline: net === 'hors-ligne', toastOpen: this.state.toast && !!NET[net],
      toastText: t ? t[0] : '', toastColor: t ? t[1] : '', toastBorder: t ? t[2] : '',
      showToast: () => this.setState({ toast: true })
    };
  }
}
</script>
</body>
</html>

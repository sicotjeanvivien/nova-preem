        opacity: sum === 0 ? 0.5 : 1, borderStyle: sum === 0 ? 'dashed' : 'solid', borderColor: sum === 0 ? '#3A4152' : '#232838',
        ring: s.sel === c.n ? '0 0 0 2px ' + accent : 'none',
        aria: (s.remove ? 'Retirer un exemplaire ' : 'Ajouter un exemplaire ') + LANG[s.lang].code + ' : ' + name + ', numéro ' + c.n,
        openAria: 'Afficher la carte ' + name,
        tap: () => this.change(c.n, s.lang, s.remove ? -1 : 1),
        open: () => this.setState({ sel: c.n })
      };
    });
    const sc = CARDS.find((x) => x.n === s.sel); const sq = s.qty[sc.n];
    const sel = {
      n: sc.n, fr: sc.fr, en: sc.en, rLabel: RARITY[sc.r].label, stripe: STRIPE[sc.col],
      rows: ['fr', 'en'].map((l) => ({
        code: LANG[l].code, color: LANG[l].color, label: LANG[l].label, qty: sq[l],
        decAria: 'Retirer un exemplaire ' + LANG[l].code, incAria: 'Ajouter un exemplaire ' + LANG[l].code,
        dec: () => this.change(sc.n, l, -1), inc: () => this.change(sc.n, l, 1)
      }))
    };
    const langBtns = ['fr', 'en'].map((l) => ({
      label: LANG[l].code, pressed: s.lang === l ? 'true' : 'false', bg: s.lang === l ? LANG[l].color : 'transparent', fg: s.lang === l ? '#0D0F14' : '#D5D9E2',
      pick: () => this.setState({ lang: l })
    }));
    const filters = [['all', 'Toutes'], ['missing', 'Manquantes'], ['owned', 'Possédées'], ['dups', 'Doublons']].map(([id, label]) => ({
      label, pressed: s.filter === id ? 'true' : 'false', bg: s.filter === id ? '#ECEEF3' : 'transparent', fg: s.filter === id ? '#0D0F14' : '#D5D9E2', border: s.filter === id ? '#ECEEF3' : '#2B3040',
      pick: () => this.setState({ filter: id })
    }));
    const releases = RELEASES.map(([id, name, group, a, b]) => {
      const on = s.release === id; const own = id === 'retail' ? ownedCount : a;
      return {
        name, group, count: own + '/' + b,
        pressed: on ? 'true' : 'false', fg: on ? '#ECEEF3' : '#A3AAB9', line: on ? accent : 'transparent',
        pick: () => this.setState({ release: id, sub: 0 })
      };
    });
    const subList = SUBS[s.release] || [];
    const subs = subList.map((label, i) => {
      const on = (s.sub || 0) === i;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#2B3040' : 'transparent', fg: on ? '#ECEEF3' : '#A3AAB9', border: on ? '#3A4152' : '#232838', pick: () => this.setState({ sub: i }) };
    });
    return {
      accent, total, ownedCount, pct: Math.floor((ownedCount / total) * 100), cards, sel, langBtns, filters, releases,
      subs, hasSubs: subs.length > 0, showLang: s.release === 'retail', isBeta: s.release === 'beta',
      releaseName: 'Retail',
      isMissingFilter: s.filter === 'missing', missingCount: total - ownedCount,
      copyMissing: () => this.setState({ last: { n: null, delta: 0, text: 'Liste des manques copiée, prête à coller sur Discord.' } }),
      removeMode: s.remove ? 'true' : 'false', modeLabel: s.remove ? 'Mode retrait' : 'Mode ajout',
      modeBg: s.remove ? '#3A1C25' : 'transparent', modeFg: s.remove ? '#FF8FAB' : '#D5D9E2', modeBorder: s.remove ? '#FF5C8A' : '#2B3040',
      toggleMode: () => this.setState({ remove: !s.remove }),
      hasToast: !!s.last, toastText: s.last ? s.last.text : '',
      undo: () => { const l = s.last; if (!l) return; if (l.n) this.change(l.n, l.lang, -l.delta); this.setState({ last: null }); }
    };
  }
}
</script>

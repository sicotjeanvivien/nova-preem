<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nova Preem — Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0F14}
a{color:#46E3C8;text-decoration:none}a:hover{color:#8AF0DD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0F14; color: #ECEEF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; padding: 12px 16px 10px; border-bottom: 1px solid #232838; display: flex; flex-direction: column; gap: 10px; background: #11141B">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 20px">Collection</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A3AAB9">{{summary}}</span>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
</sc-for>
<button onClick="{{toggleDups}}" aria-pressed="{{dupsPressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid {{dupsBorder}}; background: {{dupsBg}}; color: {{dupsFg}}">Doublons</button>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{menus}}" as="m" hint-placeholder-count="4">
<button aria-haspopup="listbox" style="height: 32px; padding: 0 8px 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; border: 1px solid #2B3040; background: #161922; color: #D5D9E2; display: flex; align-items: center; gap: 4px">{{m.label}}
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</sc-for>
</div>
</header>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #232838">
<span style="font-size: 12px; color: #A3AAB9">Trier</span>
<div role="group" aria-label="Tri" style="display: flex; gap: 2px; background: #161922; border: 1px solid #232838; border-radius: 8px; padding: 2px">
<sc-for list="{{sorts}}" as="so" hint-placeholder-count="4">
<button onClick="{{so.pick}}" aria-pressed="{{so.pressed}}" style="height: 30px; padding: 0 9px; border: 0; border-radius: 6px; cursor: pointer; font-size: 12px; background: {{so.bg}}; color: {{so.fg}}">{{so.label}}</button>
</sc-for>
</div>
</div>

<main style="flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{dupsOn}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 4px 4px; font-size: 12px; color: #A3AAB9">Au-delà de {{keep}} exemplaire par impression (seuil réglable dans Réglages). Le chiffre en couleur est le surplus.</p>
</sc-if>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="CardDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; background: #161922; border: 1px solid #232838; border-radius: 10px; color: #ECEEF3">
<div style="width: 40px; height: 56px; flex-shrink: 0; border-radius: 4px; background: #1C2029; border-top: 3px solid {{r.stripe}}"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3AAB9">
<span style="width: 8px; height: 8px; border-radius: 2px; background: {{r.rColor}}"></span>{{r.meta}}</span>
<span style="font-size: 11px; color: #8B92A3">{{r.added}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<sc-for list="{{r.badges}}" as="b" hint-placeholder-count="1">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; color: #0D0F14; background: {{b.color}}; border-radius: 4px; padding: 1px 6px">{{b.label}}</span>
</sc-for>
<sc-if value="{{r.hasExtra}}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{accent}}">+{{r.extra}} en trop</span>
</sc-if>
</div>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 32px 0; text-align: center; color: #A3AAB9; font-size: 14px">Aucune carte possédée pour ces filtres.</p>
</sc-if>
</main>

<nav aria-label="Navigation principale" style="height: 68px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #232838; background: #11141B">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="2"></rect><path d="M4 7v11a3 3 0 0 0 3 3h9"></path></svg>Sets</a>
<a href="Collection.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{accent}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path><path d="M9.5 10l2 2 3.5-3.5"></path></svg>Collection</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Recherche</a>
<a href="Completion.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Réglages</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#46E3C8","options":["#46E3C8","#FF5C8A","#FFB067","#8FB4FF"]},"$preview":{"width":390,"height":844}}'>
const RAR = { C: ['Commune', '#A3AAB9'], U: ['Peu commune', '#6FCF97'], R: ['Rare', '#5B9CFF'], E: ['Épique', '#B98CFF'], S: ['Secrète', '#FF5C8A'], IL: ['Iconic Legend', '#F2C94C'] };
const STRIPE = { R: '#E5484D', Y: '#E8C547' };
const OWNED = [
  { n: '008', rel: 'Retail', fr: 'Croc Chromé', en: 'Chrome Fang', r: 'C', col: 'R', vf: 3, vo: 0, day: 0 },
  { n: '144', rel: 'Retail', fr: 'V — Gosse Des Rues', en: 'V — Streetkid', r: 'IL', col: 'R', vf: 1, vo: 0, day: 0 },
  { n: '025', rel: 'Retail', fr: 'Lames Mantis', en: 'Mantis Blades', r: 'C', col: 'R', vf: 2, vo: 1, day: 0 },
  { n: '053', rel: 'Retail', fr: "Bombus d'Occasion", en: 'Secondhand Bombus', r: 'C', col: 'Y', vf: 3, vo: 0, day: 1 },
  { n: '003', rel: 'Retail', fr: "Johnny Silverhand — Rock'n'Rebelle", en: 'Johnny Silverhand — Rocking Renegade', r: 'S', col: 'R', vf: 1, vo: 0, day: 1 },
  { n: '020', rel: 'Retail', fr: 'V — Errance À Travers Les Badlands', en: 'V — Roamer of the Badlands', r: 'E', col: 'R', vf: 1, vo: 0, day: 1 },
  { n: '017', rel: 'Retail', fr: 'Racaille Impitoyable', en: 'Ruthless Lowlife', r: 'C', col: 'R', vf: 2, vo: 0, day: 2 },
  { n: '014', rel: 'Retail', fr: 'Meredith Stout — Corpo Sans Pitié', en: 'Meredith Stout — Stone Cold Corpo', r: 'R', col: 'R', vf: 1, vo: 1, day: 2 },
  { n: '002', rel: 'Starter Embracing Power', fr: 'Croc Chromé', en: 'Chrome Fang', r: 'C', col: 'R', vf: 0, vo: 1, day: 3 },
  { n: '044', rel: 'Retail', fr: 'Caliber — La Meilleure du Totentanz', en: "Caliber — Totentanz's Top Dog", r: 'R', col: 'Y', vf: 0, vo: 1, day: 3 },
  { n: '029', rel: 'Retail', fr: 'Bonnie et Clyde', en: 'Bonnie and Clyde', r: 'U', col: 'R', vf: 2, vo: 0, day: 4 },
  { n: '006', rel: 'Retail', fr: 'Recrues Des 6th Street', en: '6th Street Recruits', r: 'C', col: 'R', vf: 1, vo: 1, day: 4 },
  { n: '012', rel: 'Retail', fr: 'Kerry Eurodyne — Le Dernier Rockerboy', en: 'Kerry Eurodyne — The Last Rockerboy', r: 'U', col: 'R', vf: 1, vo: 0, day: 5 }
];
const DAY = ["Ajoutée aujourd'hui", 'Ajoutée hier', 'Ajoutée il y a 2 jours', 'Ajoutée il y a 3 jours', 'Ajoutée il y a 4 jours', 'Ajoutée il y a 5 jours'];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'all', dups: false, sort: 'recent' }; }
  renderVals() {
    const accent = this.props.accent ?? '#46E3C8';
    const s = this.state; const keep = 1;
    const qtyOf = (o) => (s.lang === 'fr' ? o.vf : (s.lang === 'en' ? o.vo : o.vf + o.vo));
    let list = OWNED.filter((o) => qtyOf(o) > 0);
    if (s.dups) list = list.filter((o) => qtyOf(o) > keep);
    const nameOf = (o) => (s.lang === 'en' ? o.en : o.fr);
    const sorted = list.slice();
    if (s.sort === 'number') sorted.sort((a, b) => a.n.localeCompare(b.n));
    else if (s.sort === 'name') sorted.sort((a, b) => nameOf(a).localeCompare(nameOf(b), 'fr'));
    else if (s.sort === 'qty') sorted.sort((a, b) => qtyOf(b) - qtyOf(a));
    else sorted.sort((a, b) => a.day - b.day);
    let copies = 0; list.forEach((o) => { copies += qtyOf(o); });
    const rows = sorted.map((o) => {
      const badges = [];
      if (s.lang !== 'en' && o.vf > 0) badges.push({ label: 'VF ' + o.vf, color: '#FFB067' });
      if (s.lang !== 'fr' && o.vo > 0) badges.push({ label: 'VO ' + o.vo, color: '#8FB4FF' });
      const extra = qtyOf(o) - keep;
      return {
        name: nameOf(o), stripe: STRIPE[o.col], rColor: RAR[o.r][1],
        meta: o.rel + ' #' + o.n + ' · ' + RAR[o.r][0], added: DAY[o.day], badges,
        hasExtra: s.dups && extra > 0, extra
      };
    });
    const chip = (on) => ({ bg: on ? '#ECEEF3' : 'transparent', fg: on ? '#0D0F14' : '#D5D9E2', border: on ? '#ECEEF3' : '#2B3040', pressed: on ? 'true' : 'false' });
    const langs = [['all', 'Toutes langues'], ['fr', 'VF'], ['en', 'VO']].map(([id, label]) => Object.assign({ label, pick: () => this.setState({ lang: id }) }, chip(s.lang === id)));
    const d = chip(s.dups);
    const sorts = [['recent', 'Récents'], ['number', 'Numéro'], ['name', 'Nom'], ['qty', 'Quantité']].map(([id, label]) => ({
      label, pressed: s.sort === id ? 'true' : 'false', bg: s.sort === id ? '#2B3040' : 'transparent', fg: s.sort === id ? '#ECEEF3' : '#A3AAB9',
      pick: () => this.setState({ sort: id })
    }));
    return {
      accent, rows, langs, sorts, keep, empty: rows.length === 0,
      summary: copies + ' ex. · ' + list.length + ' impressions',
      menus: [{ label: 'Set : tous' }, { label: 'Tirage' }, { label: 'Rareté' }, { label: 'Type' }, { label: 'Couleur' }],
      dupsOn: s.dups, dupsPressed: d.pressed, dupsBg: d.bg, dupsFg: d.fg, dupsBorder: d.border,
      toggleDups: () => this.setState({ dups: !s.dups })
    };
  }
}
</script>
</body>
</html>

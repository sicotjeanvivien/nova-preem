<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nova Preem — Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0D0F14}
a{color:#46E3C8;text-decoration:none}a:hover{color:#8AF0DD}
input::placeholder{color:#8B92A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0F14; color: #ECEEF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="flex-shrink: 0; padding: 12px 16px 10px; border-bottom: 1px solid #232838; display: flex; flex-direction: column; gap: 10px; background: #11141B">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 20px">Collection</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3AAB9">{{summary}}</span>
</div>
<label for="mcq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrer par nom</label>
<input id="mcq" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Nom VF ou VO…" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #2B3040; background: #161922; color: #ECEEF3; font-size: 14px; font-family: inherit">
<div style="display: flex; gap: 8px">
<label for="msort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Trier</label>
<select id="msort" onChange="{{onSort}}" style="flex: 1; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid #2B3040; background: #161922; color: #ECEEF3; font-size: 14px; font-family: inherit">
<option value="recent">Ajouts récents</option>
<option value="number">Numéro</option>
<option value="name">Nom</option>
<option value="rarity">Rareté</option>
<option value="qty">Quantité</option>
</select>
<button onClick="{{openFilters}}" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{filterBorder}}; background: transparent; color: #ECEEF3; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filtres{{filterCount}}</button>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<a href="CardDetail.dc.html" aria-label="{{c.aria}}" style="display: flex; flex-direction: column; gap: 5px; color: #ECEEF3">
<div style="position: relative; aspect-ratio: 5 / 7; border-radius: 10px; overflow: hidden; background: #1C2029; border: 1px solid #2B3040">
<div style="height: 8%; background: {{c.stripe}}; display: flex; align-items: center; padding: 0 8%"><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 10px; color: #0D0F14; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.shortName}}</span></div>
<div style="height: 52%; margin: 4% 6%; border-radius: 5px; background: #262B38; display: grid; place-items: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3A4152" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<div style="margin: 0 6%; display: flex; flex-direction: column; gap: 4px">
<span style="height: 5px; width: 90%; border-radius: 3px; background: #2B3040"></span>
<span style="height: 5px; width: 70%; border-radius: 3px; background: #2B3040"></span>
</div>
<span style="position: absolute; top: 12%; left: 5px; font-size: 10px; font-weight: 600; color: #0D0F14; background: {{c.rColor}}; padding: 1px 4px; border-radius: 3px">{{c.rShort}}</span>
<div style="position: absolute; left: 5px; right: 5px; bottom: 5px; display: flex; gap: 4px; justify-content: flex-end">
<sc-for list="{{c.badges}}" as="b" hint-placeholder-count="1">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #0D0F14; background: {{b.color}}; border-radius: 4px; padding: 1px 5px">{{b.label}}</span>
</sc-for>
</div>
<sc-if value="{{c.hasExtra}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12%; right: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #0D0F14; background: {{accent}}; border-radius: 4px; padding: 1px 5px">+{{c.extra}}</span>
</sc-if>
</div>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A3AAB9; margin-top: -3px">{{c.meta}}</span>
</a>
</sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 32px 0; text-align: center; color: #A3AAB9; font-size: 14px">Aucune carte possédée pour ces filtres.</p>
</sc-if>
</main>

<nav aria-label="Navigation principale" style="height: 68px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #232838; background: #11141B">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="2"></rect><path d="M4 7v11a3 3 0 0 0 3 3h9"></path></svg>Sets</a>
<a href="Collection.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{accent}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path><path d="M9.5 10l2 2 3.5-3.5"></path></svg>Collection</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Recherche</a>
<a href="Completion.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #A3AAB9">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Réglages</a>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(5, 6, 9, 0.72); display: flex; flex-direction: column; justify-content: flex-end">
<button onClick="{{closeFilters}}" aria-label="Fermer les filtres" style="flex: 1; border: 0; background: transparent; cursor: pointer"></button>
<section role="dialog" aria-label="Filtres" style="max-height: 640px; overflow-y: auto; background: #161922; border-top: 1px solid #2B3040; border-radius: 16px 16px 0 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #3A4152; align-self: center"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #A3AAB9; letter-spacing: 0.06em; text-transform: uppercase">Langue</span>
<div role="group" aria-label="Langue" style="display: flex; gap: 6px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
</sc-for>
</div>
</div>
<button role="switch" aria-checked="{{dupsChecked}}" onClick="{{toggleDups}}" style="display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: #ECEEF3; cursor: pointer; padding: 0; font-size: 14px; min-height: 44px">
<span style="width: 52px; height: 32px; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{dupsJustify}}; background: {{dupsTrack}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #ECEEF3"></span></span>
Doublons seulement (au-delà de 1 ex.)</button>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #A3AAB9; letter-spacing: 0.06em; text-transform: uppercase">{{g.title}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{g.options}}" as="o" hint-placeholder-count="3">
<span style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; border: 1px solid #2B3040; font-size: 13px; color: #D5D9E2">{{o}}</span>
</sc-for>
</div>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; position: sticky; bottom: 0; background: #161922; padding-top: 8px">
<button onClick="{{resetFilters}}" style="height: 44px; border-radius: 10px; border: 1px solid #2B3040; background: transparent; color: #ECEEF3; font-size: 14px; cursor: pointer">Réinitialiser</button>
<button onClick="{{closeFilters}}" style="height: 44px; border-radius: 10px; border: 0; background: {{accent}}; color: #0D0F14; font-weight: 600; font-size: 14px; cursor: pointer">Voir {{count}} cartes</button>
</div>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#46E3C8","options":["#46E3C8","#FF5C8A","#FFB067","#8FB4FF"]},"$preview":{"width":390,"height":844}}'>
const RAR = { C: ['C', '#A3AAB9', 0], U: ['PC', '#6FCF97', 1], R: ['R', '#5B9CFF', 2], E: ['É', '#B98CFF', 3], S: ['S', '#FF5C8A', 4], IL: ['IC', '#F2C94C', 5] };
const STRIPE = { R: '#E5484D', Y: '#E8C547' };
const OWNED = [
  { n: '144', rel: 'Retail', fr: 'V — Gosse Des Rues', en: 'V — Streetkid', r: 'IL', col: 'R', vf: 1, vo: 0, day: 0 },
  { n: '008', rel: 'Retail', fr: 'Croc Chromé', en: 'Chrome Fang', r: 'C', col: 'R', vf: 3, vo: 0, day: 0 },
  { n: '025', rel: 'Retail', fr: 'Lames Mantis', en: 'Mantis Blades', r: 'C', col: 'R', vf: 2, vo: 1, day: 0 },
  { n: '003', rel: 'Retail', fr: "Johnny Silverhand — Rock'n'Rebelle", en: 'Johnny Silverhand — Rocking Renegade', r: 'S', col: 'R', vf: 1, vo: 0, day: 1 },
  { n: '020', rel: 'Retail', fr: 'V — Errance À Travers Les Badlands', en: 'V — Roamer of the Badlands', r: 'E', col: 'R', vf: 1, vo: 0, day: 1 },
  { n: '053', rel: 'Retail', fr: "Bombus d'Occasion", en: 'Secondhand Bombus', r: 'C', col: 'Y', vf: 3, vo: 0, day: 1 },
  { n: '048', rel: 'Retail', fr: 'Jackie Welles — Marche ou Crève', en: 'Jackie Welles — Ride or Die Choom', r: 'E', col: 'Y', vf: 1, vo: 0, day: 2 },
  { n: '014', rel: 'Retail', fr: 'Meredith Stout — Corpo Sans Pitié', en: 'Meredith Stout — Stone Cold Corpo', r: 'R', col: 'R', vf: 1, vo: 1, day: 2 },
  { n: '017', rel: 'Retail', fr: 'Racaille Impitoyable', en: 'Ruthless Lowlife', r: 'C', col: 'R', vf: 2, vo: 0, day: 2 },
  { n: '002', rel: 'Starter Embracing Power', fr: 'Croc Chromé', en: 'Chrome Fang', r: 'C', col: 'R', vf: 0, vo: 1, day: 3 }
];
const norm = (x) => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'all', dups: false, sort: 'recent', query: '', sheet: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#46E3C8';
    const s = this.state; const q = norm(s.query.trim());
    const qtyOf = (o) => (s.lang === 'fr' ? o.vf : (s.lang === 'en' ? o.vo : o.vf + o.vo));
    const nameOf = (o) => (s.lang === 'en' ? o.en : o.fr);
    let list = OWNED.filter((o) => qtyOf(o) > 0 && (!q || norm(o.fr).includes(q) || norm(o.en).includes(q)));
    if (s.dups) list = list.filter((o) => qtyOf(o) > 1);
    const sorted = list.slice();
    if (s.sort === 'number') sorted.sort((a, b) => a.n.localeCompare(b.n));
    else if (s.sort === 'name') sorted.sort((a, b) => nameOf(a).localeCompare(nameOf(b), 'fr'));
    else if (s.sort === 'rarity') sorted.sort((a, b) => RAR[b.r][2] - RAR[a.r][2]);
    else if (s.sort === 'qty') sorted.sort((a, b) => qtyOf(b) - qtyOf(a));
    else sorted.sort((a, b) => a.day - b.day);
    let copies = 0; list.forEach((o) => { copies += qtyOf(o); });
    const cards = sorted.map((o) => {
      const badges = [];
      if (s.lang !== 'en' && o.vf > 0) badges.push({ label: 'VF ×' + o.vf, color: '#FFB067' });
      if (s.lang !== 'fr' && o.vo > 0) badges.push({ label: 'VO ×' + o.vo, color: '#8FB4FF' });
      const name = nameOf(o);
      return {
        name, shortName: name.split(' — ')[0], meta: o.rel + ' · #' + o.n, stripe: STRIPE[o.col], rShort: RAR[o.r][0], rColor: RAR[o.r][1],
        badges, hasExtra: s.dups, extra: qtyOf(o) - 1, aria: 'Ouvrir ' + name + ', ' + o.rel + ' numéro ' + o.n
      };
    });
    const chip = (on) => ({ bg: on ? '#ECEEF3' : 'transparent', fg: on ? '#0D0F14' : '#D5D9E2', border: on ? '#ECEEF3' : '#2B3040', pressed: on ? 'true' : 'false' });
    const langs = [['all', 'Toutes'], ['fr', 'VF'], ['en', 'VO']].map(([id, label]) => Object.assign({ label, pick: () => this.setState({ lang: id }) }, chip(s.lang === id)));
    const active = (s.lang !== 'all' ? 1 : 0) + (s.dups ? 1 : 0);
    const groups = [
      { title: 'Set', options: ['Welcome to Night City'] },
      { title: 'Tirage', options: ['Retail', 'Beta', 'Starters', 'Démos', 'Promos'] },
      { title: 'Rareté', options: ['Commune', 'Peu commune', 'Rare', 'Épique', 'Secrète', 'Iconic', 'Nova Rare'] },
      { title: 'Type', options: ['Legend', 'Unit', 'Gear', 'Program'] },
      { title: 'Couleur', options: ['Rouge', 'Jaune', 'Bleu', 'Vert'] }
    ];
    return {
      accent, cards, langs, groups, query: s.query, empty: cards.length === 0, count: cards.length,
      summary: copies + ' ex. · ' + list.length + ' impressions',
      filterCount: active ? ' · ' + active : '', filterBorder: active ? accent : '#2B3040',
      onQuery: (e) => this.setState({ query: e.target.value }), onSort: (e) => this.setState({ sort: e.target.value }),
      sheetOpen: s.sheet, openFilters: () => this.setState({ sheet: true }), closeFilters: () => this.setState({ sheet: false }),
      resetFilters: () => this.setState({ lang: 'all', dups: false }),
      dupsChecked: s.dups ? 'true' : 'false', dupsJustify: s.dups ? 'flex-end' : 'flex-start', dupsTrack: s.dups ? accent : '#3A4152',
      toggleDups: () => this.setState({ dups: !s.dups })
    };
  }
}
</script>
</body>
</html>
